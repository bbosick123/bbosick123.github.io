<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>활동 4 페이지 퍼블리싱</title>
        <link rel="stylesheet" href="assets/css/style.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    </head>
<body>
    <div class="activity">
        <div class="header">
            <div class="header__title">
                <img src="./assets/images/img-idea.svg" alt="아이디어 아이콘">
                <h2>활동 4</h2>
            </div>
            <div class="header__progress">
                <p>활동 4</p>
            </div>
        </div>
        <div class="contents">
            <div class="inner">
                <div class="contents__title">
                    <p><strong>4</strong>모둠을 나누어 숲에서 찾은 다양한 소리를 그림으로 표현해 봅시다.</p>
                    <div class="activity4">
                        <div class="activity4__center">
                            <div class="activity4__center-title">우리 모둠의 소리 숲</div>
                        </div>
                        <label class="activity4__item activity4__item--type01" for="textarea--type01">
                            <div class="activity4__title">목소리 신체</div>
                            <dl>
                                <dt>예</dt>
                                <dd>'휭' 소리 내며 휘파람 불기</dd>
                            </dl>
                            <div class="textarea textarea--white">
                                <textarea id="textarea--type01" rows="1"></textarea>
                            </div>
                        </label>
                        <label class="activity4__item activity4__item--type02"  for="textarea--type02">
                            <div class="activity4__title">악기</div>
                            <dl>
                                <dt>예</dt>
                                <dd>리코더의 라비움(떨청)을 막고 바람 불기</dd>
                            </dl>
                            <div class="textarea textarea--white">
                                <textarea id="textarea--type02" rows="1"></textarea>
                            </div>
                        </label>
                        <label class="activity4__item activity4__item--type03"  for="textarea--type03">
                            <div class="activity4__title">그림, 기호</div>
                            <dl>
                                <dt>예</dt>
                                <dd><img src="./assets/images/img-activity4.svg" alt="그림, 기호 예시"></dd>
                            </dl>
                            <div class="textarea textarea--white">
                                <textarea id="textarea--type03" rows="1"></textarea>
                            </div>
                        </label>
                        <label class="activity4__item activity4__item--type04"  for="textarea--type04">
                            <div class="activity4__title">물체</div>
                            <dl>
                                <dt>예</dt>
                                <dd>빈 병에 바람 불어 넣기</dd>
                            </dl>
                            <div class="textarea textarea--white">
                                <textarea id="textarea--type04" rows="1"></textarea>
                            </div>
                        </label>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
