<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>활동 4 페이지 퍼블리싱</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>
    <div class="activity ">
        <div class="header">
            <div class="header__title">
                <img src="./assets/images/img-idea.svg" alt="아이디어 아이콘">
                <h2>활동 3</h2>
            </div>
            <div class="header__progress">
                <p>활동 3</p>
            </div>
        </div>
        <div class="contents">
            <div class="inner">
                <div class="contents__title">
                    <p><strong>3</strong>빠르기가 다른 두 곡을 비교하여 감상하고, 느낌을 적어 봅시다.</p>
                </div>
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper">
                      <div class="swiper-slide">
                        <div class="inner">
                            <div class="mySwiper__box">
                                <div class="mySwiper__head">
                                    <div class="mySwiper__composer">
                                        <p>오펜바흐</p>
                                    </div>
                                    <button type="button" class="mySwiper__introduction">
                                        곡 소개
                                    </button>
                                    <div class="mySwiper__audio">
                                        <!-- <button class="mySwiper__audio-play" aria-label="재생"></button>
                                        <button class="mySwiper__audio-stop" aria-label="정지"></button>
                                        <input type="range" class="mySwiper__audio-progress" min="0" max="100" value="0" />
                                        <div class="mySwiper__audio-time">
                                            <span class="mySwiper__audio-current">00:00</span>/<span class="mySwiper__audio-duration">01:10</span>
                                        </div> -->
                                        <img src="./assets/images/temp-audio.svg" alt="오디오 임시 이미지">
                                    </div>
                                </div>
                                <div class="mySwiper__bubble">
                                    스카프로<br /> 춤을 추며 감상해 보아요
                                </div>
                                <div class="mySwiper__character">
                                    <img src="./assets/images/character.svg" alt="스카프들고 춤추는 사람">
                                </div>
                                <div class="mySwiper__form">
                                    <div class="mySwiper__form-title">"천국과 지옥" 중 '캉캉'</div>
                                    <dl>
                                        <dt>빠르기</dt>
                                        <dd>
                                            <div class="checkbox-inline">
                                                <div class="checkbox">
                                                    <input type="radio" id="check1" name="speed" checked/>
                                                    <label for="check1">
                                                        <span class="label-text">빠르다</span>
                                                    </label>
                                                </div>
                                                <div class="checkbox">
                                                    <input type="radio" id="check2"  name="speed" />
                                                    <label for="check2">
                                                        <span class="label-text">느리다</span>
                                                    </label>
                                                </div>
                                            </div>
                                        </dd>
                                    </dl>
                                    <dl>
                                        <dt>느낌</dt>
                                        <dd>
                                            <div class="textarea">
                                                <textarea rows="2" placeholder="테스트 테스트 테스트 테스트테스트 테스트 테스트 테스트"></textarea>
                                            </div>
                                        </dd>
                                    </dl>
                                </div>
                            </div>
                        </div>
                      </div>
                      <div class="swiper-slide"></div>
                      <div class="swiper-slide"></div>
                    </div>
                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- modal -->
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <div class="modal__dim"></div>
        <div class="modal__card">
            <div class="modal__head">
                <div id="modal-title" class="modal__title">
                    <img src="./assets/images/ico_note.svg" alt="">
                    <p>곡 소개</p>
                </div>
                <button class="modal__button modal__button--close" aria-label="모달 닫기">
                    <img src="./assets/images/ico_close.svg" alt="">
                </button>
            </div>
            <div class="modal__contents">
                <dl>
                    <dt>작곡가:</dt>
                    <dd>작곡가: 오펜바흐 (Offenbach, Jacques / 1819~1880)</dd>
                </dl>
                <dl>
                    <dt>악곡해설</dt>
                    <dd>
                        “천국과 지옥”이라는 제목으로 널리 알려진 오페레타 <br />
                        “지옥의 오르페우스” 중 서곡에 등장하는 매우 빠르고 <br />
                        경쾌한 <img src="./assets/images/number-modal.png" alt="2/4">박자 곡이다.
                    </dd>
                </dl>
            </div>
        </div>
    </div>
    <!-- modal -->
    <!-- script -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      var swiper = new Swiper(".mySwiper", {
        pagination: {
            el: ".swiper-pagination",
        },
        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
        },
      });



        // 모달 열기
        document.querySelector('.mySwiper__introduction').addEventListener('click', function () {
            document.querySelector('.modal').classList.add('is-open');
            document.querySelector('.modal__card').focus();
        });


        // 모달 클로즈버튼 눌러서 닫기
        document.querySelector('.modal__button--close').addEventListener('click', function () {
            document.querySelector('.modal').classList.remove('is-open');
        });

        // 모달 딤처리된 부분 클릭시 닫기
        document.querySelector('.modal__dim').addEventListener('click', function () {
            document.querySelector('.modal').classList.remove('is-open');
        });

        // 키보드 esc버튼누르기 + 모달 열려있으면 닫기
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && document.querySelector('.modal.is-open')) {
                document.querySelector('.modal.is-open').classList.remove('is-open');
            }
        });
    </script>
    <!-- // script -->
</body>
</html>
